name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
  RUST_VERSION: "1.90"

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  backend-fmt:
    name: Backend Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  backend-clippy:
    name: Backend Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev
      - run: cargo clippy --workspace --exclude extrittio-macos --all-targets -- -D warnings

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: extrittio
          POSTGRES_PASSWORD: extrittio
          POSTGRES_DB: extrittio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extrittio -d extrittio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://extrittio:extrittio@127.0.0.1:5432/extrittio?connect_timeout=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev postgresql-client
      - name: Check PostgreSQL
        run: pg_isready -h 127.0.0.1 -p 5432 -U extrittio -d extrittio
      - run: cargo test --workspace --exclude extrittio-macos

  turso-hobby:
    name: Turso Hobby (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@extrittio"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev
      - name: Build frontend for embedding
        working-directory: apps/frontend
        run: npm ci && npm run build
      - name: Verify Turso adapter
        run: |
          cargo clippy -p extrittio --no-default-features --features turso --all-targets -- -D warnings
          cargo test -p extrittio-backend --no-default-features --features turso --lib
      - name: Build standalone hobby executable
        run: |
          cargo build --release -p extrittio --no-default-features --features hobby
          cargo install --path apps/extrittio --locked --no-default-features --features hobby --root target/hobby-install
      - name: Verify artifact and first-run migration
        run: |
          if ldd target/release/extrittio | grep -E 'libpq|postgres'; then
            echo "hobby executable unexpectedly links PostgreSQL runtime libraries" >&2
            exit 1
          fi
          smoke_dir="$(mktemp -d)"
          target/release/extrittio -o json migrate --database-backend turso --deployment-profile hobby --data-dir "$smoke_dir"
          target/release/extrittio -o json database --database-backend turso --deployment-profile hobby --data-dir "$smoke_dir" info
          target/hobby-install/bin/extrittio run --help
          sha256sum target/release/extrittio > target/release/extrittio-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: extrittio-hobby-linux-${{ matrix.arch }}
          path: |
            target/release/extrittio
            target/release/extrittio-${{ matrix.arch }}.sha256

  clients-and-protocol:
    name: Clients & Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libssl-dev python3-pip
      - name: Check constrained Rust SDK features
        run: |
          cargo check -p extrittio-common --no-default-features --features alloc
          cargo check -p extrittio-sdk --no-default-features --features alloc
      - name: Test shared Rust protocol and client runtime
        run: cargo test -p extrittio-common -p extrittio-sdk -p extrittio-client-runtime
      - name: Verify nanopb output matches the canonical protocol
        run: |
          python3 -m pip install --disable-pip-version-check nanopb==0.4.9.1
          clients/c/sdk-c/scripts/generate-proto.sh
          git diff --exit-code -- clients/c/sdk-c/generated
      - name: Build and test the C SDK
        run: |
          cmake -S clients/c/sdk-c -B build/c-sdk -G Ninja
          cmake --build build/c-sdk
          ctest --test-dir build/c-sdk --output-on-failure

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@extrittio"
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Verify generated API contract
        run: npm run generate-api
      - name: Check generated files are committed
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- api/openapi.json apps/frontend/src/types/openapi.ts
      - name: TypeScript check & build
        run: npm run build

  docker:
    name: Docker Image
    needs:
      - dependency-audit
      - dependency-policy
      - backend-fmt
      - backend-clippy
      - backend-test
      - clients-and-protocol
      - frontend
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      cargo-profile: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci-release' }}

