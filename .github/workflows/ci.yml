name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
  RUST_VERSION: "1.90"

jobs:
  backend-fmt:
    name: Backend Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  backend-clippy:
    name: Backend Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev
      - run: >
          cargo clippy --workspace --exclude extrittio-macos --all-targets --
          -D warnings
          -A clippy::collapsible_if
          -A clippy::derivable_impls
          -A clippy::filter_map_bool_then
          -A clippy::iter_kv_map
          -A clippy::manual_range_contains
          -A clippy::new_without_default
          -A clippy::redundant_guards
          -A clippy::too_many_arguments
          -A clippy::type_complexity

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: extrittio
          POSTGRES_PASSWORD: extrittio
          POSTGRES_DB: extrittio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extrittio -d extrittio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://extrittio:extrittio@127.0.0.1:5432/extrittio?connect_timeout=2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev postgresql-client
      - name: Check PostgreSQL
        run: pg_isready -h 127.0.0.1 -p 5432 -U extrittio -d extrittio
      - run: cargo test --workspace --exclude extrittio-macos

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@extrittio"
      - run: npm ci
      - name: TypeScript check & build
        run: npm run build

  docker:
    name: Docker Image
    needs: [backend-fmt, backend-clippy, backend-test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      platforms: linux/amd64
      cargo-profile: ci-release

