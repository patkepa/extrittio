name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.90"

jobs:
  dependency-review:
    name: Dependency Review
    # GitHub does not provide Dependency Review for this private repository
    # without GitHub Advanced Security. Keep the gate active if it becomes public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit dependencies
        # RUSTSEC-2026-0041 is unreachable because Zenoh transport compression
        # is disabled; the time-bounded exception is documented with the
        # matching cargo-deny policy.
        run: cargo audit --ignore RUSTSEC-2026-0041

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  backend-fmt:
    name: Backend Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  backend-architecture:
    name: Backend Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - run: cargo xtask architecture

  backend-clippy:
    name: Backend Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev
      - name: Verify backend host feature matrix
        run: |
          cargo check -p extrittio-backend --no-default-features --features openapi
          cargo check -p extrittio-backend --no-default-features --features postgres
          cargo check -p extrittio-backend --no-default-features --features turso
          cargo check -p extrittio-backend --no-default-features --features all-databases
      - name: Lint extracted backend packages
        run: |
          cargo clippy -p extrittio-backend-core --all-targets -- -D warnings
          cargo clippy -p extrittio-backend-postgres --all-targets -- -D warnings
          cargo clippy -p extrittio-backend-turso --all-targets -- -D warnings
          cargo clippy -p extrittio-backend-adapter-tests --all-features --all-targets -- -D warnings
      - name: Lint remaining workspace packages
        run: >-
          cargo clippy --workspace
          --exclude extrittio-macos
          --exclude extrittio-backend-core
          --exclude extrittio-backend-postgres
          --exclude extrittio-backend-turso
          --exclude extrittio-backend-adapter-tests
          --all-targets -- -D warnings

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: extrittio
          POSTGRES_PASSWORD: extrittio
          POSTGRES_DB: extrittio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extrittio -d extrittio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://extrittio:extrittio@127.0.0.1:5432/extrittio?connect_timeout=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev postgresql-client
      - name: Check PostgreSQL
        run: pg_isready -h 127.0.0.1 -p 5432 -U extrittio -d extrittio
      - name: Test extracted backend packages
        run: |
          cargo test -p extrittio-backend-core
          cargo test -p extrittio-backend-postgres
          cargo test -p extrittio-backend-turso
      - name: Test remaining workspace packages
        run: >-
          cargo test --workspace
          --exclude extrittio-macos
          --exclude extrittio-backend-core
          --exclude extrittio-backend-postgres
          --exclude extrittio-backend-turso
          --features extrittio-backend/openapi
      - name: Verify PostgreSQL adapter contract
        run: |
          cargo test -p extrittio-backend-adapter-tests --features postgres --test postgres_zones
          cargo test -p extrittio-backend-adapter-tests --features postgres --test postgres_roles
          cargo test -p extrittio-backend-adapter-tests --features postgres --test postgres_users
      - name: Verify generated OpenAPI contract
        run: cargo run -p extrittio-backend --features openapi --bin openapi -- api/openapi.json
      - name: Check generated OpenAPI contract is committed
        run: git diff --exit-code -- api/openapi.json

  turso-edge:
    name: Turso Edge (${{ matrix.arch }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    env:
      EDGE_CARGO_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci-release' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev
      - name: Verify Turso adapter
        run: |
          cargo clippy -p extrittio --no-default-features --features turso --all-targets -- -D warnings
          cargo test -p extrittio-backend --no-default-features --features turso --lib
          cargo test -p extrittio-backend-adapter-tests --features turso --test turso_zones
          cargo test -p extrittio-backend-adapter-tests --features turso --test turso_roles
          cargo test -p extrittio-backend-adapter-tests --features turso --test turso_users
      - name: Build standalone Extrittio Edge executable
        run: |
          cargo build --profile "$EDGE_CARGO_PROFILE" -p extrittio --no-default-features --features edge
          install -D -m 0755 "target/$EDGE_CARGO_PROFILE/extrittio" target/edge-install/bin/extrittio
      - name: Verify artifact and first-run migration
        run: |
          edge_binary="target/$EDGE_CARGO_PROFILE/extrittio"
          if ldd "$edge_binary" | grep -E 'libpq|postgres'; then
            echo "Extrittio Edge executable unexpectedly links PostgreSQL runtime libraries" >&2
            exit 1
          fi
          smoke_dir="$(mktemp -d)"
          "$edge_binary" -o json migrate --database-backend turso --deployment-profile edge --data-dir "$smoke_dir"
          "$edge_binary" -o json database --database-backend turso --deployment-profile edge --data-dir "$smoke_dir" info
          target/edge-install/bin/extrittio run --help
          sha256sum "$edge_binary" > "target/$EDGE_CARGO_PROFILE/extrittio-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: extrittio-edge-linux-${{ matrix.arch }}
          path: |
            target/${{ env.EDGE_CARGO_PROFILE }}/extrittio
            target/${{ env.EDGE_CARGO_PROFILE }}/extrittio-${{ matrix.arch }}.sha256

  clients-and-protocol:
    name: Clients & Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libssl-dev python3-pip
      - name: Install pinned nanopb generator
        run: python3 -m pip install --disable-pip-version-check nanopb==0.4.9.1
      - name: Run shared protocol verification
        run: cargo xtask verify protocol

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@extrittio"
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Verify generated API contract
        run: npm run generate-api-types
      - name: Check generated files are committed
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- apps/frontend/src/types/openapi.ts
      - name: TypeScript check & build
        run: npm run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker Image
    needs:
      - dependency-audit
      - dependency-policy
      - backend-architecture
      - backend-fmt
      - backend-clippy
      - backend-test
      - clients-and-protocol
      - frontend
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      cargo-profile: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci-release' }}
