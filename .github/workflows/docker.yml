name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Image platforms to build
        required: false
        default: linux/amd64,linux/arm64
      cargo-profile:
        description: Cargo profile for the Rust binary
        required: false
        default: release
  workflow_call:
    inputs:
      platforms:
        description: Image platforms to build
        required: false
        type: string
        default: linux/amd64
      cargo-profile:
        description: Cargo profile for the Rust binary
        required: false
        type: string
        default: ci-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/extrittio
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
  DOCKER_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  CARGO_PROFILE: ${{ inputs.cargo-profile || 'release' }}

jobs:
  app:
    name: Combined App Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: contains(env.DOCKER_PLATFORMS, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build timestamp
        id: build
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXTRITTIO_VERSION=${{ steps.meta.outputs.version }}
            EXTRITTIO_COMMIT_SHA=${{ github.sha }}
            EXTRITTIO_BUILD_TIMESTAMP=${{ steps.build.outputs.timestamp }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          secrets: |
            node_auth_token=${{ env.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
