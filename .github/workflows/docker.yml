name: Docker

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Image platforms to build
        required: false
        default: linux/amd64
        type: string
      cargo-profile:
        description: Cargo profile for the Rust binary
        required: false
        default: ci-release
        type: string
      publish:
        description: Push, sign, and attest the image
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      platforms:
        description: Image platforms to build
        required: false
        type: string
        default: linux/amd64
      cargo-profile:
        description: Cargo profile for the Rust binary
        required: false
        type: string
        default: ci-release
      publish:
        description: Push, sign, and attest the image
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.publish }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: extrittio:ci-smoke
  DOCKER_PLATFORMS: ${{ inputs.platforms }}
  CARGO_PROFILE: ${{ inputs.cargo-profile }}

jobs:
  app:
    name: Combined App Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate publishing ref
        if: inputs.publish
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Publishing is restricted to main and v* tags" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: contains(env.DOCKER_PLATFORMS, 'arm64')
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: inputs.publish
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build timestamp
        id: build
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: image
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          tags: ${{ inputs.publish && steps.meta.outputs.tags || env.LOCAL_IMAGE }}
          labels: ${{ inputs.publish && steps.meta.outputs.labels || '' }}
          build-args: |
            EXTRITTIO_VERSION=${{ inputs.publish && steps.meta.outputs.version || github.sha }}
            EXTRITTIO_COMMIT_SHA=${{ github.sha }}
            EXTRITTIO_BUILD_TIMESTAMP=${{ steps.build.outputs.timestamp }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test local image
        if: ${{ !inputs.publish }}
        run: docker run --rm "$LOCAL_IMAGE" ./extrittio --help
      - name: Generate SPDX SBOM
        if: inputs.publish
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: extrittio.spdx.json
      - name: Upload SBOM
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extrittio-${{ github.sha }}-sbom
          path: extrittio.spdx.json
          if-no-files-found: error
      - name: Install Cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image by digest
        if: inputs.publish
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
