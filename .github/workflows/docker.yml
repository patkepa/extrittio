name: Docker

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Image platforms to build
        required: false
        default: linux/amd64,linux/arm64
      cargo-profile:
        description: Cargo profile for the Rust binary
        required: false
        default: release
  workflow_call:
    inputs:
      platforms:
        description: Image platforms to build
        required: false
        type: string
        default: linux/amd64
      cargo-profile:
        description: Cargo profile for the Rust binary
        required: false
        type: string
        default: ci-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/extrittio
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
  DOCKER_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  CARGO_PROFILE: ${{ inputs.cargo-profile || 'release' }}

jobs:
  app:
    name: Combined App Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: contains(env.DOCKER_PLATFORMS, 'arm64')

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build timestamp
        id: build
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXTRITTIO_VERSION=${{ steps.meta.outputs.version }}
            EXTRITTIO_COMMIT_SHA=${{ github.sha }}
            EXTRITTIO_BUILD_TIMESTAMP=${{ steps.build.outputs.timestamp }}
            CARGO_PROFILE=${{ env.CARGO_PROFILE }}
          secrets: |
            node_auth_token=${{ env.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: extrittio.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extrittio-${{ github.sha }}-sbom
          path: extrittio.spdx.json
          if-no-files-found: error

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image by digest
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
