[package]
name = "extrittio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
production = ["postgres", "jemalloc", "extrittio-backend/production"]
jemalloc = ["dep:tikv-jemallocator"]
postgres = ["extrittio-backend/postgres"]
turso = ["extrittio-backend/turso"]
s3 = ["extrittio-backend/s3"]
otlp = ["extrittio-backend/otlp"]
openapi = ["extrittio-backend/openapi"]
swagger-ui = ["extrittio-backend/swagger-ui"]
mdns = ["extrittio-backend/mdns"]
edge = ["turso", "extrittio-backend/embedded-ui", "swagger-ui", "mdns"]
all-databases = ["postgres", "turso"]

[[bin]]
name = "extrittio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
extrittio-backend = { version = "0.1.0", path = "../../crates/backend", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "multipart", "rustls-no-provider", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
dirs = "6"
extrittio-openthread-runtime = { version = "0.1.0", path = "../../crates/openthread-runtime" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
