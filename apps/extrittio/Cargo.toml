[package]
name = "extrittio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
postgres = ["extrittio-backend/postgres"]
turso = ["extrittio-backend/turso"]
hobby = ["turso", "extrittio-backend/embedded-ui"]
all-databases = ["postgres", "turso"]

[[bin]]
name = "extrittio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
extrittio-backend = { version = "0.1.0", path = "../../crates/backend", default-features = false }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
rand = "0.8"
dirs = "6"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
