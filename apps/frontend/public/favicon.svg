<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <!-- EX monogram: E's middle bar extends to X's crossing point -->
  <g filter="url(#glow)">
    <!-- E: vertical bar + 3 horizontal bars (middle bar reaches X center) -->
    <path d="M 116 140 H 280 V 172 H 148 V 240 H 339 V 272 H 148 V 340 H 280 V 372 H 116 Z" fill="#2D72D2"/>
    <!-- X: two diagonals starting where E's top/bottom bars end -->
    <line x1="280" y1="140" x2="398" y2="372" stroke="#2D72D2" stroke-width="32"/>
    <line x1="398" y1="140" x2="280" y2="372" stroke="#2D72D2" stroke-width="32"/>
  </g>
</svg>
