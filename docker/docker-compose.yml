services:
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrittio
      POSTGRES_USER: extrittio
      POSTGRES_PASSWORD: extrittio
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgres://extrittio:extrittio@postgres/extrittio
      - PORT=8080
      - CORS_ORIGIN=*
      - RUST_LOG=extrittio=info,extrittio_backend=info
      # - JWT_SECRET=change-me-in-production
    networks:
      - app
      - zenoh

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  pgdata:

networks:
  app:
  zenoh:
    driver: bridge
