services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrittio
      POSTGRES_USER: extrittio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extrittio -d extrittio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  extrittio:
    image: ${EXTRITTIO_IMAGE:-ghcr.io/extrittio/extrittio}:${EXTRITTIO_VERSION:?set EXTRITTIO_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://extrittio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/extrittio
      PORT: "8080"
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      EXTRITTIO_PUBLIC_URL: ${EXTRITTIO_PUBLIC_URL:?set EXTRITTIO_PUBLIC_URL}
      EXTRITTIO_COOKIE_SECURE: "true"
      EXTRITTIO_SERVE_UI: "true"
      EXTRITTIO_ENABLE_API_DOCS: "false"
      EXTRITTIO_KEY_ENCRYPTION_SECRET: ${EXTRITTIO_KEY_ENCRYPTION_SECRET:?set EXTRITTIO_KEY_ENCRYPTION_SECRET}
      EXTRITTIO_BOOTSTRAP_ADMIN_USERNAME: ${EXTRITTIO_BOOTSTRAP_ADMIN_USERNAME:-admin}
      EXTRITTIO_BOOTSTRAP_ADMIN_PASSWORD: ${EXTRITTIO_BOOTSTRAP_ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ZENOH_TLS_ENABLED: ${ZENOH_TLS_ENABLED:-false}
      ZENOH_LISTEN_HOST: ${ZENOH_LISTEN_HOST:-127.0.0.1}
      ZENOH_MAX_PAYLOAD_KB: ${ZENOH_MAX_PAYLOAD_KB:-256}
      RUST_LOG: ${RUST_LOG:-extrittio=info,extrittio_backend=info}
    expose:
      - "8080"
    volumes:
      - certs:/app/certs
    networks:
      - app
      - zenoh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      extrittio:
        condition: service_healthy
    environment:
      EXTRITTIO_DOMAIN: ${EXTRITTIO_DOMAIN:?set EXTRITTIO_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.release.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Host: ${EXTRITTIO_DOMAIN}\" -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  pgdata:
  certs:

networks:
  app:
  zenoh:
    driver: bridge

