services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrittio
      POSTGRES_USER: extrittio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extrittio -d extrittio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/patkepa/extrittio-backend:${EXTRITTIO_VERSION:?set EXTRITTIO_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://extrittio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/extrittio
      - PORT=8080
      - CORS_ORIGIN=${CORS_ORIGIN:?set CORS_ORIGIN}
      - EXTRITTIO_PUBLIC_URL=${EXTRITTIO_PUBLIC_URL:?set EXTRITTIO_PUBLIC_URL}
      - EXTRITTIO_COOKIE_SECURE=true
      - EXTRITTIO_SERVE_UI=false
      - EXTRITTIO_KEY_ENCRYPTION_SECRET=${EXTRITTIO_KEY_ENCRYPTION_SECRET:?set EXTRITTIO_KEY_ENCRYPTION_SECRET}
      - EXTRITTIO_HEALTH_TOKEN=${EXTRITTIO_HEALTH_TOKEN:?set EXTRITTIO_HEALTH_TOKEN}
      - EXTRITTIO_REQUIRE_ENV_SECRETS=true
      - EXTRITTIO_TRUSTED_PROXIES=${EXTRITTIO_TRUSTED_PROXIES:-172.30.0.3}
      - EXTRITTIO_ENABLE_API_DOCS=false
      - EXTRITTIO_BOOTSTRAP_ADMIN_USERNAME=${EXTRITTIO_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - EXTRITTIO_BOOTSTRAP_ADMIN_PASSWORD=${EXTRITTIO_BOOTSTRAP_ADMIN_PASSWORD:-}
      - ZENOH_TLS_ENABLED=true
      - ZENOH_LISTEN_HOST=${ZENOH_LISTEN_HOST:-127.0.0.1}
      - ZENOH_MAX_PAYLOAD_KB=${ZENOH_MAX_PAYLOAD_KB:-256}
      - RUST_LOG=extrittio=info,extrittio_backend=info
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
    networks:
      - app
      - zenoh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Extrittio-Health-Token: $${EXTRITTIO_HEALTH_TOKEN}\" http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ghcr.io/patkepa/extrittio-frontend:${EXTRITTIO_VERSION:?set EXTRITTIO_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EXTRITTIO_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  zenoh:
    driver: bridge
