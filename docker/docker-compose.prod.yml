services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrittio
      POSTGRES_USER: extrittio
      POSTGRES_PASSWORD: extrittio
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app

  backend:
    image: ghcr.io/patkepa/extrittio-backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgres://extrittio:extrittio@postgres/extrittio
      - PORT=8080
      - CORS_ORIGIN=*
      - RUST_LOG=extrittio_backend=info
      # - JWT_SECRET=change-me-in-production
    networks:
      - app
      - zenoh

  frontend:
    image: ghcr.io/patkepa/extrittio-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  pgdata:

networks:
  app:
  zenoh:
    driver: bridge
