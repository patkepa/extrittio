services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: extrittio
      POSTGRES_USER: extrittio
      POSTGRES_PASSWORD: extrittio
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extrittio -d extrittio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/patkepa/extrittio-backend:${EXTRITTIO_VERSION:?set EXTRITTIO_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://extrittio:extrittio@postgres/extrittio
      - PORT=8080
      - CORS_ORIGIN=*
      - RUST_LOG=extrittio=info,extrittio_backend=info
      # - JWT_SECRET=change-me-in-production
    networks:
      - app
      - zenoh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ghcr.io/patkepa/extrittio-frontend:${EXTRITTIO_VERSION:?set EXTRITTIO_VERSION}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgdata:

networks:
  app:
  zenoh:
    driver: bridge
