[package]
name = "extrittio-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
extrittio-common = { path = "../../../common" }
extrittio-sdk = { path = "../sdk" }
prost = "0.13"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = "1"
