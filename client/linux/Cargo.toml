[package]
name = "extrittio-client"
version = "0.1.0"
edition = "2024"

[dependencies]
extrittio-proto = { path = "../../proto" }
zenoh = "1"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["stream"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
