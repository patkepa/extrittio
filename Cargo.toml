[workspace]
resolver = "2"
members = [
    "apps/extrittio",
    "crates/backend",
    "crates/backend-adapter-tests",
    "crates/backend-core",
    "crates/backend-postgres",
    "crates/backend-turso",
    "crates/common",
    "crates/device-contract",
    "crates/openthread-runtime",
    "crates/rule-engine",
    "clients/rust/linux",
    "clients/rust/macos",
    "clients/rust/rpi",
    "clients/rust/runtime",
    "clients/rust/sdk",
    "clients/rust/simulator",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Extrittio contributors"]
repository = "https://github.com/extrittio/extrittio"
homepage = "https://github.com/extrittio/extrittio"
publish = false

[profile.dev]
debug = 1

[profile.test]
debug = 1

# Optimized release profile for production builds
[profile.release]
lto = "fat"           # Full link-time optimization across all crates
codegen-units = 1     # Single codegen unit for maximum optimization
strip = true          # Strip debug symbols — smaller binary
panic = "abort"       # No unwinding overhead — smaller + faster

# Faster image builds for main-branch CI. Tagged releases still use `release`.
[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 16
