[package]
name = "extrittio-common"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["dep:prost", "dep:serde_json", "dep:prost-build"]
alloc = []

[dependencies]
prost = { version = "0.13", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
prost-build = { version = "0.13", optional = true }
