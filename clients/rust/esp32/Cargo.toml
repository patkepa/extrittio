[package]
name = "extrittio-client-esp32"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# NOTE: This crate is NOT a workspace member — it cross-compiles to
# riscv32imc-esp-espidf and must be built independently:
#   cd clients/rust/esp32
#   cargo build
#
# To target a different ESP32 variant, update .cargo/config.toml:
#   ESP32   (Xtensa)  → target = "xtensa-esp32-espidf"   (requires `channel = "esp"` toolchain)
#   ESP32-S3 (Xtensa) → target = "xtensa-esp32s3-espidf" (requires `channel = "esp"` toolchain)
#   ESP32-C3 (RISC-V) → target = "riscv32imc-esp-espidf" (standard nightly, current default)
#   ESP32-C6 (RISC-V) → target = "riscv32imac-esp-espidf" (standard nightly)

[dependencies]
extrittio-common = { path = "../../../crates/common", default-features = false, features = ["std"] }
extrittio-sdk = { path = "../sdk", default-features = false, features = ["std"] }
extrittio-client-contract = { path = "../contract" }
chrono = { version = "0.4", features = ["clock"] }
embedded-svc = "0.28"
prost = "0.14"
zenoh = { version = "1", default-features = false, features = ["transport_tcp"] }
esp-idf-svc = { version = "0.50", features = ["binstart"] }
log = "0.4"
rand = { version = "0.8", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
pnet_datalink = { path = "vendor/pnet_datalink" }
pnet_sys = { path = "vendor/pnet_sys" }
stabby = { path = "vendor/stabby" }
stabby-abi = { path = "vendor/stabby-abi" }
zenoh-util = { path = "vendor/zenoh-util" }
zenoh-runtime = { path = "vendor/zenoh-runtime" }
zenoh-link-tcp = { path = "vendor/zenoh-link-tcp" }
