syntax = "proto3";
package extrittio;

message DeviceTelemetry {
    string device_id = 1;
    int64 timestamp = 2;
    float temperature = 3;
    float humidity = 4;
    float battery_level = 5;
    map<string, string> metadata = 6;
    double latitude = 7;
    double longitude = 8;
    float speed = 9;
    float altitude = 10;
    float heading = 11;
    bool has_location = 12;
}

message DeviceHeartbeat {
    string device_id = 1;
    int64 timestamp = 2;
    string status = 3;
    string firmware = 4;
    int64 uptime_seconds = 5;
}

message DeviceCommand {
    string command = 1;
    map<string, string> params = 2;
    string correlation_id = 3;
}

message DeviceCommandResponse {
    string correlation_id = 1;
    string device_id = 2;
    string status = 3;
    string payload = 4;
    int64 timestamp = 5;
}

message ShadowReport {
    string device_id = 1;
    int64 timestamp = 2;
    string state_json = 3;
    int64 version = 4;
}

message ShadowDelta {
    string device_id = 1;
    string delta_json = 2;
    int64 version = 3;
}

message ShadowGet {
    string device_id = 1;
}

message DeviceLog {
    string device_id = 1;
    int64 timestamp = 2;
    string level = 3;
    string message = 4;
}
