name: Release Packages

on:
  push:
    tags: ["ui-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish UI Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
          scope: "@extrittio"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build playground
        run: npm run build:playground

      - name: Publish workspaces
        run: >
          npm publish
          --access public
          --workspace @extrittio/navigation
          --workspace @extrittio/interactions
          --workspace @extrittio/ui
          --workspace @extrittio/theme
          --workspace @extrittio/data-client
          --workspace @extrittio/command-palette
          --workspace @extrittio/app-shell
